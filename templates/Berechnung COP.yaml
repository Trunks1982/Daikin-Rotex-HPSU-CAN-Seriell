template:
  - sensor:
    - default_entity_id: sensor.cop_wert
      name: COP Wert
      state: >-
        {% set thermische_leistung = states('sensor.rotex_thermische_leistung') | float(0) %}
        {% set stromverbrauch = states('sensor.wp_channel_a_power') | float(0) / 1000 %}
        {% if is_state('binary_sensor.rotex_status_kompressor', 'on') and stromverbrauch > 0 %}
          {# negative thermal power while cooling #}
          {{ (thermische_leistung | abs / stromverbrauch) | round(2) }}
        {% else %}
          0
        {% endif %}
